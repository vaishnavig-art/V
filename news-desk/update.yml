name: Update news

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:          # adds a "Run workflow" button

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_news.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Save the new news file
        run: |
          git config user.name "news-desk-bot"
          git config user.email "news-desk-bot@users.noreply.github.com"
          git add docs/data/news.json
          git diff --cached --quiet && exit 0
          git commit -m "News update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
