# News sources the desk watches.
# Each source has: name (the outlet), section, url (its RSS feed).
# Sections: National, International, Business, Tech, Lifestyle, Entertainment, Telangana & Hyd, Top
# "Top" feeds have no fixed section; their stories are sorted by keywords.
# To add a source: copy any 3-line block below, change the values, save.
# To remove one: delete its 3 lines, or put # in front of them.

